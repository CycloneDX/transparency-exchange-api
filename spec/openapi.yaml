                $ref: "#/components/schemas/productRelease"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-component-response:
      description: A paginated response containing TEA Components
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/component"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-component-release-response:
      description: A paginated response containing TEA Component Releases
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/release"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
        - hasNext: false
          results: []
    paginated-collection-response:
      description: A paginated response containing TEA Collections
      allOf:
