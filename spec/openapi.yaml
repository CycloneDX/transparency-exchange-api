  headers:
    artifact-content-disposition:
      description: |
        Suggested filename for the artifact content, as an `attachment` disposition
        per RFC 6266.
      schema:
        type: string
        examples:
          - attachment; filename="log4j-core-2.24.3-cyclonedx.json"
    artifact-etag:
      description: |
        Strong entity tag for the content. A TEA Artifact revision is immutable, so
        the entity tag for a given uuid, version and format never changes.
      schema:
        type: string
    artifact-repr-digest:
      description: |
        Digest of the content as defined in RFC 9530, allowing a client to verify the
        bytes against the `checksums` published in the artifact metadata.
      schema:
        type: string
    artifact-cache-control-immutable:
      description: |
        Servers should mark the content of a specific revision as immutable and
        cacheable: the bytes for a given uuid, version and format never change.
      schema:
        type: string
        examples:
          - 'public, max-age=31536000, immutable'
    artifact-cache-control-latest:
      description: |
        The latest revision is a moving target: which revision it resolves to changes
        when a new revision is published. Servers shall not mark it immutable and
        should require revalidation, so that a cache reuses stored content only after
        confirming, through the `ETag`, that the latest revision has not changed.
      schema:
        type: string
        examples:
          - 'no-cache'
    artifact-content-location:
      description: |
        The versioned download URL of the revision this response was resolved to,
        per RFC 9110 section 8.7. A client that needs a stable, reproducible reference
        to the bytes it received uses this URL rather than the `latest` URL.
      schema:
        type: string
        format: uri-reference
        examples:
          - /artifact/2ff3ae7c-8eab-4e0b-9b8b-1a0c4c4c1c2d/3/download
    signature-content-disposition:
      description: |
        Suggested filename for the signature, as an `attachment` disposition per
        RFC 6266.
      schema:
        type: string
        examples:
          - attachment; filename="log4j-core-2.24.3-cyclonedx.json.sig"
    signature-etag:
      description: |
        Strong entity tag for the signature. A signature belongs to one format of one
        immutable revision, so it is fixed with the revision: content that is re-signed
        is published as a new revision.
      schema:
        type: string
    signature-content-location:
      description: |
        The versioned signature download URL of the revision this response was resolved
        to, per RFC 9110 section 8.7.
      schema:
        type: string
        format: uri-reference
        examples:
          - /artifact/2ff3ae7c-8eab-4e0b-9b8b-1a0c4c4c1c2d/3/signature/download
  responses:
    204-common-delete:
      description: Object deleted successfully
      content:
        application/json: {}
    400-invalid-request:
      description: |
        Request was invalid. For paginated requests, this includes malformed, invalid,
        expired, or conflicting `pageToken` values, including conflicts with continuation
        parameters or path parameters.
      content:
        application/json: {}
    401-unauthorized:
      description: |
        Authentication required, or the presented access token is expired, revoked, or
        otherwise invalid. Servers shall include a `WWW-Authenticate` header as defined
        in RFC 6750 section 3. On the `invalid_token` error a client may obtain a fresh
        token from `/token` and retry the request once (RFC 6750 section 3.1).

        Open servers that require no authentication on any endpoint shall not return this
        status. On a mixed server, only protected endpoints return `401`; open endpoints
        answer without requiring a Bearer token.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, as defined in RFC 6750 section 3.
          schema:
            type: string
            example: Bearer realm="tea", error="invalid_token", error_description="The access token expired"
      content:
        application/json: {}
    403-forbidden:
      description: |
        The client is authenticated, but is not authorized to access this resource or
        perform this operation. Authorization decisions are server-specific and are not
        constrained by this specification.

        Servers may instead conceal the existence of a resource by answering `404` (see
        `404-object-by-id-not-found`). Clients shall treat `403` and a concealing `404` as
        non-access; neither implies that retrying with the same token will succeed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    artifact-content:
      description: |
        The content of the requested TEA Artifact format.

        The `Content-Type` is the `mediaType` of the format returned.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/artifact-content-disposition"
        ETag:
          $ref: "#/components/headers/artifact-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-immutable"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    artifact-content-latest:
      description: |
        The content of the selected format of the latest revision of the TEA Artifact,
        as resolved at the time of the request.

        Identical to `artifact-content` except for its cache policy: the latest revision
        changes when a new revision is published, so the response is not immutable and
        a cache shall revalidate it before reuse. The `ETag` is that of the resolved
        revision's content, so revalidation succeeds with `304 Not Modified` until a new
        revision is published. `Content-Location` names the versioned URL the request
        was resolved to.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/artifact-content-disposition"
        ETag:
          $ref: "#/components/headers/artifact-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-latest"
        Content-Location:
          $ref: "#/components/headers/artifact-content-location"
        Repr-Digest:
          $ref: "#/components/headers/artifact-repr-digest"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    artifact-signature-content:
      description: |
        The detached signature for the selected format of the TEA Artifact revision.

        The `Content-Type` is `application/octet-stream` unless the server knows a more
        specific media type for the signature it holds, in which case it returns that.
        This specification does not require servers to identify the signature technology.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/signature-content-disposition"
        ETag:
          $ref: "#/components/headers/signature-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-immutable"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    artifact-signature-content-latest:
      description: |
        The detached signature for the selected format of the latest revision of the TEA
        Artifact, as resolved at the time of the request.

        Identical to `artifact-signature-content` except for its cache policy: the latest
        revision changes when a new revision is published, so the response is not
        immutable and a cache shall revalidate it before reuse. `Content-Location` names
        the versioned URL the request was resolved to.
      headers:
        Content-Disposition:
          $ref: "#/components/headers/signature-content-disposition"
        ETag:
          $ref: "#/components/headers/signature-etag"
        Cache-Control:
          $ref: "#/components/headers/artifact-cache-control-latest"
        Content-Location:
          $ref: "#/components/headers/signature-content-location"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    artifact-content-redirect:
      description: |
        The artifact content is available at another location, for example object storage
        addressed by a pre-signed URL. The client follows the `Location` header.

        A client shall not send its TEA access token when following a redirect to a
        different origin.
      headers:
        Location:
          description: Location the artifact content can be retrieved from.
          required: true
          schema:
            type: string
            format: uri
    406-no-acceptable-format:
      description: |
        The artifact revision exists, but has no format matching the requested
        `mediaType` or `Accept` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    token-issued:
      description: Credentials accepted, access token issued
      headers:
        Cache-Control:
          description: Servers shall set `no-store` on token responses (RFC 6749 section 5.1).
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-response"
    400-token-error:
      description: |
        The token request was malformed, used an unsupported grant type, or the
        credentials presented were not valid for the requested grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-error-response"
    401-token-error:
      description: |
        Client authentication failed. Returned instead of 400 when the client attempted
        to authenticate using the `Authorization` header (RFC 6749 section 5.2).
      headers:
        WWW-Authenticate:
          description: Challenge indicating the client authentication methods supported by the token endpoint.
          schema:
            type: string
            example: Basic realm="tea"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token-error-response"
    404-object-by-id-not-found:
      description: |
        Object requested by identifier not found, or the server intentionally conceals
        the object's existence from this client (for example when the client is
        unauthenticated or authenticated but not authorized). Clients shall not infer
        from `404` alone whether the object is absent or withheld.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    discovery-response:
      description: Discovery information for the requested TEI
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/discovery-info"
    paginated-product:
      description: A paginated response containing TEA Products
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-response"
    paginated-product-release:
      description: A paginated response containing TEA Product Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-release-response"
    paginated-component:
      description: A paginated response containing TEA Components
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-response"
    paginated-component-release:
      description: A paginated response containing TEA Component Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-release-response"
    paginated-collection:
      description: A paginated response containing TEA Collections
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-collection-response"
                    
  parameters:
    # Artifact content
    artifact-media-type:
      name: mediaType
      description: |
        Selects which of the artifact revision's `formats` to return, by its `mediaType`.
        Provide the media type as a URL-encoded string per RFC 3986.

        When omitted, the server selects a format using the request's `Accept` header per
        RFC 9110 section 12, and falls back to a format of its choice when `Accept` does
        not constrain the result. In either case the `Content-Type` of the response states
        which format was returned.
      in: query
      required: false
      schema:
        type: string
        examples:
          - application%2Fvnd.cyclonedx%2Bjson
    artifact-signature-media-type:
      name: mediaType
      description: |
        Selects which of the artifact revision's `formats` the returned signature applies
        to, by that format's `mediaType`. This is the media type of the signed content,
        not of the signature. Provide it as a URL-encoded string per RFC 3986.

        When omitted, the server selects a format of its choice. Requests that need a
        specific format's signature should always supply this parameter, since the
        response does not otherwise state which format was signed.
      in: query
      required: false
      schema:
        type: string
        examples:
          - application%2Fvnd.cyclonedx%2Bjson
    # Pagination
    page-size:
      name: pageSize
      description: The maximum number of results to return.
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 25
    page-token:
      name: pageToken
      description: |
        An opaque continuation token produced by a previous response.
        This token MUST be copied verbatim from the `nextPageToken` value returned by the previous response.
        Clients MUST NOT parse, construct, or modify this token.

        The token represents continuation state for the original query, including
        `sortField`, `sortOrder`, result-affecting filters such as `idType` and `idValue`,
        and path parameters such as parent `uuid`.
        When `pageToken` is supplied, clients MUST NOT change those result-affecting query
        parameters. Servers MUST return `400 Bad Request` if supplied result-affecting query
        parameters conflict with the token state. To change any result-affecting parameter,
        clients MUST start a new pagination sequence without `pageToken`.

        A `pageToken` is only valid with the same request path and same path parameter values
        used to obtain it. Clients MUST NOT reuse a `pageToken` across different parent
        resource paths or different path `uuid` values. Servers MUST return `400 Bad Request`
        when a `pageToken` is used with a different path or different path parameter values.

        Servers MUST return `400 Bad Request` for malformed, invalid, expired, or conflicting
        `pageToken` values.
      in: query
      required: false
      schema:
        type: string
    sort-order:
      name: sortOrder
      description: |
        The direction of the sort.
        
        The default is `asc` for all paginated resources. Clients that need newest
        release or collection versions first can request `sortOrder=desc`.

        The selected sort order applies to both the primary `sortField` and the
        resource-specific deterministic secondary tie-breaker. For products, components,
        product releases, and component releases, the secondary key is `uuid`. For collections,
        the secondary key is `version` if additional tie-breaking is needed.
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    # Pagination Sort Fields per TEA Object Type
    sort-field-collection:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated collection results MUST be ordered first by the selected `sortField`,
        then by `version` as the deterministic secondary key if additional tie-breaking
        is needed. Collection UUIDs are not used as tie-breakers because collection UUIDs
        match the associated release UUID and can be shared across collection revisions.

        The only currently supported collection `sortField` is `version`, so the secondary
        `version` key is redundant unless additional collection sort fields are added later.
      in: query
      required: false
      schema:
        type: string
        enum:
          - version
        default: version
    sort-field-component:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results MUST be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-component-release:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results MUST be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.

        When `version` is selected, ordering is by the stored version string according to
        the server's documented string collation; semantic-version precedence is not implied.
        Servers MUST apply a stable and deterministic string collation for version sorting,
        and the same collation MUST be used consistently across pages for a pagination sequence.

        When `releaseDate` is selected, releases without a `releaseDate` MUST be ordered
        consistently. Missing `releaseDate` values sort after populated `releaseDate` values
        for ascending order and before populated `releaseDate` values for descending order.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate
    sort-field-product:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results MUST be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-product-release:
      name: sortField
      description: |
        The field by which to sort the results.

        Paginated results MUST be ordered first by the selected `sortField`, then by `uuid`
        as a deterministic secondary tie-breaker.

        When `version` is selected, ordering is by the stored version string according to
        the server's documented string collation; semantic-version precedence is not implied.
        Servers MUST apply a stable and deterministic string collation for version sorting,
        and the same collation MUST be used consistently across pages for a pagination sequence.

        When `releaseDate` is selected, releases without a `releaseDate` MUST be ordered
        consistently. Missing `releaseDate` values sort after populated `releaseDate` values
        for ascending order and before populated `releaseDate` values for descending order.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate

    #
    # Query by identifier
    #
    # Since OpenAPI 3.0 it is possible to use RFC 6570-based serialization for JSON parameters of type array or object:
    #   https://swagger.io/docs/specification/v3_0/serialization/
    #
    # Unfortunately many tools don't support it, for example,
    # the `openapi-generator` for Java does not handle this correctly.
    #   https://github.com/OpenAPITools/openapi-generator/issues/4808
    #
    # This can be uncommented, when RFC 6570-base serialization reaches a wider adoption:
    #
    # identifier-param:
    #   name: identifierParam
    #   description: If present, only the objects with the given identifier will be returned.
    #   in: query
    #   schema:
    #     $ref: "#/components/schemas/identifier"
    #   style: form
    #   explode: true
    #
    # In the meantime we explode the object manually:
    id-type:
      # To allow RFC 6570 in the future without breaking changes to the HTTP API,
      # the name of this parameter should be identical to the equivalent property in /components/schemas/identifier
      name: idType
      description: Type of identifier specified in the `idValue` parameter
      in: query
      schema:
        $ref: "#/components/schemas/identifier-type"
    id-value:
      # To allow RFC 6570 in the future without breaking changes to the HTTP API,
      # the name of this parameter should be identical to the equivalent property in /components/schemas/identifier
      name: idValue
      description: If present, only the objects with the given identifier value will be returned.
      in: query
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A TEA access token obtained from `/token`, presented as
        `Authorization: Bearer <access_token>` (RFC 6750). This is the only credential
        accepted on TEA endpoints other than `/token`.

        Resource operations declare both this requirement and an empty alternative so
        that open and mixed servers are representable: a client may call without a
        token. Whether a given endpoint actually requires a token is discovered at
        runtime from a `401` Bearer challenge (see `401-unauthorized`), not from this
        document alone. Open servers shall ignore a presented Bearer token; mixed
        servers may leave some endpoints open and protect others. Authorization after
        authentication (filtered views, `403`, or concealing `404`) remains
        server-specific.
    basicAuth:
      type: http
      scheme: basic
      description: |
        API key credentials, presented to `/token` only: the API key identifier as the
        user-id and the API key secret as the password (RFC 7617, RFC 6749 section
        2.3.1). Servers shall not accept API key credentials directly on other TEA
        endpoints; clients shall exchange them for an access token first.
security:
  # Bearer token, or anonymous access (open endpoint / open server). Protected
  # endpoints still answer 401 with a Bearer challenge when a valid token is required.
  - bearerAuth: []
  - {}
tags:
  - name: TEA Authentication
  - name: TEA Product
  - name: TEA Product Release
  - name: TEA Component
  - name: TEA Component Release
  - name: TEA Artifact
  - name: TEA Discovery
  - name: CLE
externalDocs:
  description: Transparency Exchange API specification
  url: https://github.com/CycloneDX/transparency-exchange-api
