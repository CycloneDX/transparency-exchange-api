              description: CycloneDX SBOM (XML)
              url: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml
              signatureUrl: https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3-cyclonedx.xml.asc
              checksums:
                - algType: SHA-256
                  algValue: e04c9d55986d7194822eaa4f8115a77f801844d807ad6e0d454ac31dd41861e5
                - algType: SHA-1
                  algValue: 5a7d4caef63c5c5ccdf07c39337323529eb5a770
        - uuid: dfa35519-9734-4259-bba1-3e825cf4be06
          version: 7
          name: Vulnerability Disclosure Report
          type: VULNERABILITIES
          createdDate: 2026-05-15T00:00:00Z
          formats:
            - mediaType: application/vnd.cyclonedx+xml
              description: CycloneDX VDR (XML)
              url: https://logging.apache.org/cyclonedx/vdr.xml
              checksums:
                - algType: SHA-256
                  algValue: 75b81020b3917cb682b1a7605ade431e062f7a4c01a412f0b87543b6e995ad2a
    artifact-type:
      type: string
      description: Specifies the type of external reference.
      enum:
        - ATTESTATION
        - BOM
        - BUILD_META
        - CERTIFICATION
        - FORMULATION
        - LICENSE
        - RELEASE_NOTES
        - SECURITY_TXT
        - THREAT_MODEL
        - VULNERABILITIES
        - OTHER
    artifact-format:
      type: object
      description: A security-related document in a specific format
      required:
        - mediaType
      properties:
        mediaType:
          type: string
          description: |
            The Media Type of the document.

            A media type shall appear at most once across the `formats` of a single TEA
            Artifact revision, so that every format can be selected unambiguously by
            media type when downloading its content or its signature.
        description:
          type: string
          description: A free text describing the TEA Artifact
        url:
          type: string
          description: |
            External download URL for this format of the TEA Artifact.

            This is always a location outside the TEA API. When present, clients shall
            retrieve the content from it. When absent, the TEA server hosts the content
            itself and clients shall retrieve it from the artifact download endpoint,
            `/artifact/{uuid}/{artifactVersion}/download`, selecting this format by its
            `mediaType`.

            A TEA access token is sent only to the TEA server's own API base URL, never
            to an external URL: external locations are either openly accessible,
            pre-signed, or covered by credentials the client arranges separately. When
            the URL is pre-signed it may expire; clients should not retain it beyond the
            freshness lifetime of the response that carried it. A server may replace an
            expired or renewed URL in place: that is not a new artifact revision, and the
            content and checksums it points to are unchanged.
          format: uri
        signatureUrl:
          type: string
          description: |
            External download URL for a detached signature of this format of the TEA
            Artifact.

            As with `url`, this is always a location outside the TEA API. When present,
            clients shall retrieve the signature from it. When absent, clients shall
            retrieve it from the artifact signature download endpoint,
            `/artifact/{uuid}/{artifactVersion}/signature/download`, selecting this
            format by its `mediaType`; that endpoint returns `404` when no signature is
            published for the format. The same access token and pre-signed URL rules
            as for `url` apply.

            This specification does not define which signature technology is used, nor
            model the signing algorithm, key, or certificate chain.
          format: uri
        checksums:
          type: array
          description: |
            Array of checksums for this artifact format's content bytes (the payload
            retrieved from `url` or from the artifact download endpoint for this
            `mediaType`), not the detached signature.
          items:
            "$ref": "#/components/schemas/checksum"
    checksum:
      type: object
      description: |
        Integrity digest for identified content bytes. `algValue` is the lowercase
        hexadecimal encoding of the digest produced by `algType` over those bytes.
        The hex length shall match the algorithm's digest size (for example 40 for
        SHA-1, 64 for SHA-256 / SHA3-256 / BLAKE2b-256 / BLAKE3, 96 for SHA-384 /
        SHA3-384 / BLAKE2b-384, 128 for SHA-512 / SHA3-512 / BLAKE2b-512).
      properties:
        algType:
          description: Checksum algorithm
          "$ref": "#/components/schemas/checksum-type"
        algValue:
          type: string
          description: |
            Lowercase hexadecimal digest value for `algType`. Do not use Base64 or
            uppercase hex.
          pattern: '^[0-9a-f]+$'
          minLength: 40
          maxLength: 128
          example: 9da736a1cdd27231e70187cbc67398d29ca0b714f885e7032da9f1fb247693c1
      required:
        - algType
        - algValue
    checksum-type:
      type: string
      description: Checksum algorithm
      enum:
        - SHA-1
        - SHA-256
        - SHA-384
        - SHA-512
        - SHA3-256
        - SHA3-384
        - SHA3-512
        - BLAKE2b-256
        - BLAKE2b-384
        - BLAKE2b-512
        - BLAKE3
    unknown-error-type:
      type: string
      description: Classification of TEA error response
      enum:
        - OBJECT_UNKNOWN
        - OBJECT_NOT_SHAREABLE
        - NOT_IMPLEMENTED
        - NO_ACCEPTABLE_FORMAT
        - SIGNATURE_NOT_FOUND
        - INVALID_REQUEST
        - INVALID_PAGE_TOKEN
    #
    # Types used in API responses
    #
    error-response:
      type: object
      description: |
        TEA API error body. Servers shall emit exactly this shape. Clients recognize a TEA
        error by an `application/json` response whose body is a JSON object with a string
        `error` property; they ignore unrecognized properties and tolerate `error` values
        they do not know, so that later versions can extend this schema. Other JSON 404
        bodies are not TEA error responses.

        Any `4xx` from a resource endpoint may carry an `error-response` body; when
        present, `error` is from `unknown-error-type`. Clients shall not require a body.
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/unknown-error-type"
      required:
        - error

    tea-server-info:
      type: object
      description: TEA server information including URL, versions, and optional priority
      additionalProperties: false
      properties:
        rootUrl:
          description: |
            Absolute API base URL for this TEA server, without trailing slash. Shall not
            include userinfo, query, or fragment. The scheme match is lowercase only
            (normalized form). Conforming deployments use lowercase `https`; `http` is
            allowed only so local-test documents still validate.
          type: string
          format: uri
          pattern: '^https?://[^/?#@]+(/[^?#\s]*[^/?#\s])?$'
          example: https://api.teaexample.com
        versions:
          description: |
            Supported TEA API versions at this server, without a leading `v`. Each value
            is full SemVer 2.0.0 (MAJOR.MINOR.PATCH with optional prerelease and build
            metadata). Clients select the highest mutually supported version and append
            `/v` followed by that exact string.
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
            description: TEA OpenAPI Spec version identifier (full SemVer 2.0.0)
          example: ["1.0.0"]
        priority:
          description: |
            Optional priority for this server (0.0 to 1.0, where 1.0 is highest priority).
            If omitted in the JSON response, clients shall treat the effective priority as 1.0 when
            ordering servers (the same rule as for `.well-known/tea` endpoint `priority`).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          example: 0.8
      required:
        - rootUrl
        - versions

    discovery-info:
      type: object
      description: |
        Discovery information for one product release matched by a TEI or PURL lookup.
        A successful `/discovery` response is a non-empty array of these objects, ordered
        by priority when more than one release matches (first entry highest).
        `.well-known/tea` selects where `/discovery` is called; `servers[]` lists API bases
        that serve this product release (same version and priority selection rules). A
        `rootUrl` need not appear in the well-known endpoint list.
      additionalProperties: false
      properties:
        productReleaseUuid:
          description: UUID of the resolved TEA Product Release
          $ref: "#/components/schemas/uuid"
          example: d4d9f54a-abcf-11ee-ac79-1a52914d44b1
        servers:
          description: |
            Non-empty array of TEA servers that serve this product release. Each entry
            has `rootUrl` (without trailing slash) and `versions`.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/tea-server-info"
      required:
        - productReleaseUuid
        - servers

    #
    # CLE (Common Lifecycle Enumeration) objects
    # Based on ECMA-428 TC54 TG3 CLE Specification v1.0.0
    #
    cle-event-type:
      type: string
      description: The type of CLE lifecycle event
      enum:
        - released
        - endOfDevelopment
        - endOfSupport
        - endOfLife
        - endOfDistribution
        - endOfMarketing
        - supersededBy
        - componentRenamed
        - withdrawn
    cle-version-specifier:
      type: object
      description: |
        Which versions an event affects. Exactly one of `version` or `range`. `range` is an
        ECMA-428 version specification (`vers`). `version` names a single version without a
        `vers` scheme and is a TEA extension: it maps to `vers:<scheme>/<version>` when the
        ecosystem is known.
      properties:
        version:
          type: string
          description: A specific version string
        range:
          type: string
          description: A version range in vers format (e.g. "vers:npm/>=1.0.0|<2.0.0")
    cle-event:
      type: object
      description: |
        A discrete lifecycle event from the CLE specification (ECMA-428).

        CLE timestamps in TEA responses use the shared `date-time` schema: UTC with the
        `Z` designator, fractional seconds preserved. A `+00:00` offset in an upstream CLE
        document denotes the same instant and is re-expressed as `Z`. Any other offset is
        not UTC and is not valid CLE.
      properties:
        id:
          type: integer
          description: A unique, auto-incrementing integer identifier for the event
        type:
          description: The type of lifecycle event
          $ref: "#/components/schemas/cle-event-type"
        effective:
          description: When the event takes effect.
          "$ref": "#/components/schemas/date-time"
        published:
          description: When the event was first published.
          "$ref": "#/components/schemas/date-time"
        version:
          type: string
          description: Version string (used by released event type)
        versions:
          type: array
          description: List of version specifiers affected by this event
          items:
            $ref: "#/components/schemas/cle-version-specifier"
        supportId:
          type: string
          description: Reference to a support policy ID defined in the definitions section
        license:
          type: string
          description: License identifier (used by released event type)
        supersededByVersion:
          type: string
          description: Version string that supersedes the affected versions (used by supersededBy event type)
        identifiers:
          type: array
          description: |
            New identifiers for the component (`componentRenamed` only), in the TEA
            `identifier` shape. Corresponds to CLE `identifiers[]` with `type` / `value`.
          items:
            $ref: "#/components/schemas/identifier"
        eventId:
          type: integer
          description: ID of the event being withdrawn (used by withdrawn event type)
        reason:
          type: string
          description: Human-readable explanation (used by withdrawn event type)
        description:
          type: string
          description: Human-readable description of the event
        references:
          type: array
          description: List of URLs to supporting documentation
          items:
            type: string
            format: uri
      required:
        - id
        - type
        - effective
        - published
      examples:
        - id: 1
          type: released
          effective: "2024-01-01T00:00:00Z"
          version: "1.0.0"
          license: MIT
          published: "2023-06-01T00:00:00Z"
        - id: 3
          type: endOfSupport
          effective: "2024-01-01T00:00:00Z"
          versions:
            - version: "1.0.0"
          supportId: standard
          published: "2023-06-01T00:00:00Z"
    cle-support-definition:
      type: object
      description: A support policy definition from CLE
      properties:
        id:
          type: string
          description: Unique identifier for the support policy
        description:
          type: string
          description: Human-readable description of the policy
        url:
          type: string
          format: uri
          description: URL to detailed documentation about this support policy
      required:
        - id
        - description
      examples:
        - id: standard
          description: Standard product support policy
          url: https://example.com/support/standard
    cle-definitions:
      type: object
      description: Container for reusable CLE policy definitions
      properties:
        support:
          type: array
          description: List of support policies
          items:
            $ref: "#/components/schemas/cle-support-definition"
    cle:
      type: object
      description: |
        Lifecycle events for the object this endpoint is called on, as a TEA projection of
        the Common Lifecycle Enumeration (ECMA-428, 1st edition).

        This is not a CLE document. The document envelope (`$schema`, `identifier`,
        `updatedAt`, and `index` / `next` page chaining) is not carried: the TEA object the
        response belongs to supplies the identity, and TEA has its own pagination. The event
        vocabulary, ordering and semantics are those of ECMA-428; the field shapes are TEA's.
        A consumer that needs a CLE document applies the mapping rules below and adds the
        envelope; a producer that holds a CLE document applies them in reverse. Publishers
        that need a bit-identical CLE 1.0.0 document publish it as a TEA Artifact in a
        release collection, as artifact type `OTHER` until a dedicated type exists; the
        same artifact may be referenced from more than one collection. The CLE endpoints
        are not a substitute for that document.

        Mapping to ECMA-428:
        - `identifiers[]` on `componentRenamed` uses the TEA `identifier` shape (`idType`,
          `idValue`); CLE uses `type` / `value` with the same meaning.
        - A version specifier `{ version }` names one version without a `vers` scheme,
          because a TEA server does not always know the package ecosystem. It corresponds to
          the CLE range `vers:<scheme>/<version>` once the scheme is known. `{ range }` is a
          CLE range as-is.
        - `cle-event` is one flat object. The fields ECMA-428 requires or permits for each
          event type apply as written there; servers shall populate the required ones and
          omit fields that do not belong to the type.

        `events` shall be ordered by `id` descending, as in ECMA-428. A server that provides CLE
        for an object answers `200`, with an empty `events` array when no event has been
        recorded yet. A server that does not provide CLE for the object answers `404` with
        `error: NOT_IMPLEMENTED`; `error: OBJECT_UNKNOWN` means the object itself is unknown.
      properties:
        events:
          type: array
          description: |
            Array of CLE Event objects representing lifecycle events. Events shall be ordered
            by id descending (newest events with highest IDs first).
          items:
            $ref: "#/components/schemas/cle-event"
        definitions:
          description: Container for reusable policy definitions referenced by events
          $ref: "#/components/schemas/cle-definitions"
      required:
        - events
      examples:
        - events:
            - id: 3
              type: endOfSupport
              effective: "2025-06-01T00:00:00Z"
              versions:
                - range: "vers:npm/>=1.0.0|<2.0.0"
              supportId: standard
              published: "2025-01-01T00:00:00Z"
            - id: 2
              type: endOfDevelopment
              effective: "2025-01-01T00:00:00Z"
              versions:
                - version: "1.0.0"
              supportId: standard
              published: "2024-06-01T00:00:00Z"
            - id: 1
              type: released
              effective: "2024-01-01T00:00:00Z"
              version: "1.0.0"
              license: Apache-2.0
              published: "2024-01-01T00:00:00Z"
          definitions:
            support:
              - id: standard
                description: Standard product support policy
                url: https://example.com/support/standard

    pagination-details:
      type: object
      properties:
        hasNext:
          type: boolean
          description: |
            A flag indicating whether there is another page of results to fetch.

            When `hasNext` is `true`, `nextPageToken` MUST be present.
            When `hasNext` is `false`, `nextPageToken` MUST NOT be included.
          default: false
        nextPageToken:
          type: string
          description: |
            An opaque token that can be used in a following request to retrieve the next page of results.

            This field MUST be present when `hasNext` is `true`.
            This field MUST NOT be included when `hasNext` is `false`.
      required:
        - hasNext
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
        - hasNext: false
    paginated-product-response:
      description: A paginated response containing TEA Products
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
