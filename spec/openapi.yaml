        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/release"
          required:
            - results
      examples:
        - hasNext: true
          nextPageToken: eyJwYWdlIjoiY29udGludWF0aW9uIn0
          results: []
