# $schema: https://spec.openapis.org/oas/3.1/schema-base/2025-02-13
openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Transparency Exchange API
  summary: The OWASP Transparency Exchange API specification for consumers
  description: |
    The Transparency Exchange API (TEA) aims to facilitate the automated exchange
    of supply chain artifacts such as Software Bill of Materials (SBOM),
    Vulnerability Exploitability eXchange (VEX), and attestations,
    allowing users to automatically discover and consume transparency-related
    artifacts for a product. The TEA enhances transparency across the software
    supply chain by providing a standardized method to share and access critical
    security and compliance information. This automation benefits release management
    and optimizes procurement processes, ensuring timely updates and improving risk management.
    TEA is developed within the OWASP CycloneDX project and standardised in ECMA International
    technical Committee 54, task group 1.
  contact:
    name: ECMA International, TC54 tg1
    url: https://tc54.org/tea/
  license:
    name: Apache 2.0
    url: https://github.com/CycloneDX/transparency-exchange-api/blob/main/LICENSE
  version: 0.5.0
servers:
  - url: http://localhost/tea/v1.0.0
    description: Local development only; HTTPS is required outside local testing
paths:
  /product/{uuid}:
    get:
      description: Get a TEA Product by UUID
      operationId: getTeaProductByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the TEA product in the TEA server
          schema:
            "$ref": "#/components/schemas/uuid"
      responses:
        '200':
          description: Requested TEA Product found and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product"
        '400':
          $ref: "#/components/responses/400-invalid-request"
        '401':
          $ref: "#/components/responses/401-unauthorized"
        '403':
          $ref: "#/components/responses/403-forbidden"
        '404':
          $ref: "#/components/responses/404-object-by-id-not-found"
      tags:
        - TEA Product
  /product/{uuid}/releases:
    get:
      description: Get releases of the product
      operationId: getReleasesByProductId
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Product in the TEA server
          schema:
            "$ref": "#/components/schemas/uuid"
        - $ref: "#/components/parameters/page-size"
        - $ref: "#/components/parameters/page-token"
        - $ref: "#/components/parameters/sort-field-product-release"
        - $ref: "#/components/parameters/sort-order"
      responses:
        '200':
          $ref: "#/components/responses/paginated-product-release"
        '400':
          $ref: "#/components/responses/400-invalid-request"
        '401':
          $ref: "#/components/responses/401-unauthorized"
        '403':
          $ref: "#/components/responses/403-forbidden"
        '404':
          $ref: "#/components/responses/404-object-by-id-not-found"
      tags:
        - TEA Product Release
  /productRelease/{uuid}:
    get:
      description: Get a TEA Product Release
      operationId: getTeaProductReleaseByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Product Release in the TEA server
          schema:
            "$ref": "#/components/schemas/uuid"
      responses:
        '200':
          description: Requested TEA Product Release found and returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/productRelease"
        '400':
          $ref: "#/components/responses/400-invalid-request"
        '401':
          $ref: "#/components/responses/401-unauthorized"
        '403':
          $ref: "#/components/responses/403-forbidden"
        '404':
          $ref: "#/components/responses/404-object-by-id-not-found"
      tags:
        - TEA Product Release
  /productRelease/{uuid}/cle:
    get:
      description: Get the CLE (Common Lifecycle Enumeration) data for a TEA Product Release
      operationId: getCleByProductReleaseId
      parameters:
        - name: uuid
          in: path
          required: true
          description: Unique UUID of TEA Product Release in the TEA server
          schema:
            "$ref": "#/components/schemas/uuid"
      responses:
        '200':
          description: CLE data for the requested TEA Product Release found and returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cle"
        '400':
          $ref: "#/components/responses/400-invalid-request"
        '401':
          $ref: "#/components/responses/401-unauthorized"
        '403':
          $ref: "#/components/responses/403-forbidden"
        '404':
          $ref: "#/components/responses/404-object-by-id-not-found"
      tags:
        - CLE
  /productReleases:
    get:
      description: Returns a list of TEA product releases. Note that multiple product releases may match.
      operationId: queryTeaProductReleases
      parameters:
        # For result filtering
        - $ref: "#/components/parameters/id-type"
        - $ref: "#/components/parameters/id-value"
        # For pagination
